<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes"
    >
    <meta
        name="description"
        content="PTE Academic Describe Image 数据跟读练习工具"
    >
    <title>PTE DI Data Reading Practice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.pearsonpte.com.cn/content/dam/global/shared/brand/evolution/favicons/favicon-light-16.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 PTE DI 数据跟读练习</h1>
        </header>

        <div class="info-bar" aria-label="练习状态">
            <span>进度: <span id="progress">0/0</span></span>
            <span>计时: <span id="timer-display">00:00</span></span>
        </div>

        <main>
            <section class="data-card" aria-label="数据跟读练习">
                <div id="data-figure" class="data-figure">—</div>

                <div class="speak-area">
                    <button
                        id="speak-btn"
                        class="speak-btn"
                        type="button"
                        aria-label="重新朗读当前数据"
                        title="重新朗读当前数据"
                        disabled
                    >🔊</button>
                </div>

                <div class="button-group">
                    <button
                        id="action-btn"
                        class="action-btn"
                        type="button"
                        disabled
                    >下一个</button>
                </div>

                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></div>
            </section>
        </main>

        <footer class="footer">
            <p>Designed &amp; Developed By <span>Jimmy Wu</span> © 2025</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
